# Public model names are stable aliases; the Gemini IDs behind them change often.
# Per-person virtual keys decide which of these each role may use.
model_list:
  - model_name: gemini-flash          # Ask level, and the default everywhere
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: global
  - model_name: gemini-pro            # Suggest and Build levels: edits and coding
    litellm_params:
      model: vertex_ai/gemini-3.1-pro-preview
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: global

  # Partner models on Vertex AI: still Google Cloud, still the project's bill, same IAM.
  # The gateway serves all of them; each person's key decides who may use which (role.yaml
  # levels, or Govern > Policy). LiteLLM can't price the "-maas" models on its own and would
  # log their spend as $0, so budgets would never stop anyone: the prices are pinned here,
  # per token, from Vertex AI's price list (Oct 2026). Check them when you change a model ID.
  - model_name: kimi-k2
    litellm_params:
      model: vertex_ai/moonshotai/kimi-k2-thinking-maas
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: global
      input_cost_per_token: 0.0000006
      output_cost_per_token: 0.0000025
  - model_name: qwen-coder
    litellm_params:
      model: vertex_ai/qwen/qwen3-coder-480b-a35b-instruct-maas
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: global
      input_cost_per_token: 0.00000022
      output_cost_per_token: 0.0000018
  - model_name: deepseek
    litellm_params:
      model: vertex_ai/deepseek-ai/deepseek-v3.2-maas
      vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
      vertex_location: global
      input_cost_per_token: 0.00000056
      output_cost_per_token: 0.00000168

  # Claude on Vertex AI: request quota first (it starts at 0 for "anthropic-claude-sonnet"),
  # then uncomment, add it to role.yaml's models, and redeploy the gateway.
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: vertex_ai/claude-sonnet-5-5
  #     vertex_project: os.environ/GOOGLE_CLOUD_PROJECT
  #     vertex_location: global

  # OpenAI (customer's own contract): store the key as secret openai-api-key, mount it as
  # OPENAI_API_KEY on the gateway, and use the model ID your OpenAI contract offers.
  # - model_name: openai-codex
  #   litellm_params:
  #     model: openai/YOUR_CODEX_MODEL_ID
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10   # db-f1-micro allows ~25 connections
  store_model_in_db: false             # models come from this file only
