# Who gets which level of AI. Everyone here is made up: the FirstRound team.
# RoleSpace reads this file. The model gateway enforces each level's models and budget on the
# person's own key; RoleSpace code enforces tools and paths. Run gateway/provision_keys.py
# (and coder/sync_build_keys.sh for Build) after editing.
# A Govern admin can also change each level's models, budget and limits, and switch models on
# or off, in the app (Govern > Policy) without touching this file. Those changes are stored in
# Firestore, sit on top of this file, and are pushed to everyone's gateway key at once.

company: FirstRound
company_domain: firstround.example   # onboarding accepts work emails on this domain only
repo: praveensaharan/firstround-demo

# Projects: a repository and the team that owns it. A person works on the projects listed
# for them (all of them when none are listed), switches between them in the assistant, and
# finds all of them cloned in a Build workspace. pull_requests: Suggest-level edits become pull
# requests only here (the repo has the designer-allowlist CI check and the GitHub token).
projects:
  firstround:
    name: FirstRound screening app
    repo: praveensaharan/firstround-demo
    team: screening
    pull_requests: true
  rolespace:
    name: RoleSpace
    repo: praveensaharan/RoleSpace
    team: platform
  screener:
    name: FirstRound original screener
    repo: praveensaharan/firstround
    team: screening

# Every model the gateway can serve (gateway/config.yaml). Levels pick from the enabled ones.
# status: enabled = in use | available = served by the gateway, an admin can switch it on in
# Govern > Policy | setup = needs the one-time step in the note first.
models:
  gemini-flash:  {label: Gemini 3.8 Flash, provider: Google · Vertex AI, status: enabled}
  gemini-pro:    {label: Gemini 3.1 Pro, provider: Google · Vertex AI, status: enabled}
  kimi-k2:       {label: Kimi K2 Thinking, provider: Moonshot AI · Vertex AI, status: enabled}
  qwen-coder:    {label: Qwen3 Coder 480B, provider: Alibaba Qwen · Vertex AI, status: enabled}
  deepseek:      {label: DeepSeek V3.2, provider: DeepSeek · Vertex AI, status: available}

levels:
  ask:      # PM: questions about the code, answers with checked citations, no writes
    models: [gemini-flash, kimi-k2]
    budget_usd: 2.00
    rpm_limit: 30           # per person's key: stops runaway loops, not normal use
    tpm_limit: 1000000       # an answer reads ~13K tokens per model call
    agent_model: gemini-flash
    tools: [list_files, search_code, read_file, draft_request]
  suggest:  # designer: small edits inside the allow-list, as a PR a human merges
    models: [gemini-flash, gemini-pro, kimi-k2, qwen-coder]
    budget_usd: 1.00
    rpm_limit: 60
    tpm_limit: 2000000
    agent_model: gemini-flash
    tools: [list_files, search_code, read_file, draft_request, propose_edit]
    allow_paths: ["public/css/**", "public/**/*.html"]
    deny_paths: ["lib/**", "server.mjs"]   # listed for clarity; anything not allowed is denied
  build:    # developer: Coder workspace with Gemini CLI
    models: [gemini-flash, gemini-pro, kimi-k2, qwen-coder]
    budget_usd: 10.00
    rpm_limit: 120
    tpm_limit: 4000000
    tools: [list_files, search_code, read_file, draft_request]
  govern:   # platform admin: roles, budgets, spend, audit
    models: [gemini-flash]
    budget_usd: 1.00
    rpm_limit: 30
    tpm_limit: 1000000
    tools: [list_files, search_code, read_file, draft_request]

budget_period: 30d

# Who owns which code: requests drafted at Ask or Suggest level go to the owner's inbox.
teams:
  screening: {owner: sam}
  platform:  {owner: ava}

# Just-in-time elevation: a person may ask to hold a higher level for a few hours.
# A Govern-level person approves; the gateway key changes for that time and changes back.
elevation:
  allow:
    ask: [suggest]
  max_hours: 8

# For the impact estimate on Govern > Overview (an assumption, shown as one).
roi:
  minutes_per_question: 15

people:
  - id: maya
    name: Maya Chen
    email: maya@firstround.example
    title: Product manager
    team: screening
    level: ask
  - id: leo
    name: Leo Park
    email: leo@firstround.example
    title: Product designer
    team: screening
    level: suggest
  - id: sam
    name: Sam Okafor
    email: sam@firstround.example
    title: Developer
    team: screening
    level: build
  - id: ava
    name: Ava Rossi
    email: ava@firstround.example
    title: Platform admin
    team: platform
    level: govern
